# Publica o app no GitHub Pages (arquivo único dist/gtplan-followup.html como index.html).
# Só roda quando você dispara manualmente: GitHub → Actions → "Publicar no GitHub Pages" → Run workflow.
# Antes da primeira vez: Settings → Pages → Source = "GitHub Actions".
name: Publicar no GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes
        run: node --test tests/engine.test.mjs tests/depara-cloud.test.mjs
      - name: Gerar arquivo único
        run: node build.mjs
      - name: Montar site
        run: |
          mkdir -p site
          cp dist/gtplan-followup.html site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
